name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build backend (TypeScript)
        run: npm run build:electron

      - name: Build frontend (Vite)
        run: npm run build

      - name: Smoke test
        run: node test/smoke-test.mjs

      - name: Runtime integration test
        run: node test/runtime-test-2.mjs

      - name: CLI integration test
        run: node cli/bin/ar.mjs test run --cli

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build all
        run: |
          npm run build:electron
          npm run build

      - name: Build Electron package
        run: npm run electron:build

      # ── Package Electron build ──
      - name: Package Electron app
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/AgentRouter-${{ github.ref_name }}-win-x64.zip -Force

      # ── GitHub Release ──
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentRouter ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release/AgentRouter-*.zip

      # ── npm publish (CLI) ──
      - name: Set npm version
        run: npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: |
          npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          npm publish --access public
